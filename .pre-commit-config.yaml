# Fast, host-side checks on every commit. The full suite (mypy, import-linter,
# tsc, oxlint, tests) runs in Docker via `make check`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # compose files use !reset / !override tags
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$  # tsconfig allows comments
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
