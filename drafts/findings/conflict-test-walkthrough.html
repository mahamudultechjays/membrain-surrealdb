<title>Conflict Test Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark band with a stage rail; below, two panes: Agent Memory (left, live per stage) and the stage card (right). */
:root {
  --band: #131c33; --band-fg: #eef1f8; --band-muted: #9aa5c0; --band-line: #2a3654;
  --bg: #f2f4f8; --surface: #ffffff; --sunk: #f6f7fb; --fg: #172033; --muted: #5a6479; --line: #dde2ec;
  --accent: #5a5fd6; --accent-fg: #ffffff; --accent-soft: #eceefc;
  --ingest: #2f6db5; --ingest-bg: #e6eef9;
  --cons: #2b8657; --cons-bg: #e3f3ea;
  --elab: #a8690f; --elab-bg: #fbf0dc;
  --refl: #7346c0; --refl-bg: #f0eafb;
  --warn: #a8690f; --warn-bg: #fbf0dc;
  --why-bg: #fbf4e4; --why-line: #ecdcb4;
  --display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #0c1222; --band-fg: #e8ecf6; --band-muted: #8d98b4; --band-line: #222c45;
    --bg: #111725; --surface: #18202f; --sunk: #141b29; --fg: #e4e8f1; --muted: #9aa3b8; --line: #2a3346;
    --accent: #8e93ff; --accent-fg: #0f1424; --accent-soft: #23284a;
    --ingest: #7fb0ec; --ingest-bg: #1a2a40; --cons: #6fcf9a; --cons-bg: #17301f;
    --elab: #e8b45e; --elab-bg: #33281a; --refl: #b89af0; --refl-bg: #2a2140;
    --warn: #e8b45e; --warn-bg: #33281a; --why-bg: #2c2618; --why-line: #4a3f25;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #0c1222; --band-fg: #e8ecf6; --band-muted: #8d98b4; --band-line: #222c45;
  --bg: #111725; --surface: #18202f; --sunk: #141b29; --fg: #e4e8f1; --muted: #9aa3b8; --line: #2a3346;
  --accent: #8e93ff; --accent-fg: #0f1424; --accent-soft: #23284a;
  --ingest: #7fb0ec; --ingest-bg: #1a2a40; --cons: #6fcf9a; --cons-bg: #17301f;
  --elab: #e8b45e; --elab-bg: #33281a; --refl: #b89af0; --refl-bg: #2a2140;
  --warn: #e8b45e; --warn-bg: #33281a; --why-bg: #2c2618; --why-line: #4a3f25;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15.5px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: .86em; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Band and stage rail */
.band { background: var(--band); color: var(--band-fg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.band-in { max-width: 1320px; margin: 0 auto; padding-block: 16px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.band h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.band h1::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--elab); flex: none; }
.band h1 small { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--band-muted); }
.rail { display: flex; overflow-x: auto; scrollbar-width: thin; }
.rail button { flex: 1 0 128px; background: none; border: 0; border-top: 3px solid var(--band-line); color: var(--band-muted); text-align: left; padding: 8px 12px 12px 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.rail button .n { font-family: var(--mono); font-size: 11px; }
.rail button .l { font-size: 13.5px; line-height: 1.25; }
.rail button.done { border-top-color: var(--accent); color: var(--band-fg); }
.rail button.on { border-top-color: var(--elab); color: var(--band-fg); font-weight: 600; }
.rail button:hover { color: var(--band-fg); }

/* Two panes */
.main { max-width: 1320px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.pane { min-width: 0; }

/* Memory pane */
.mem { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 132px); display: flex; flex-direction: column; }
.mem-head { padding: 16px 16px 12px; border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.mem-head h2 { font-size: 17px; }
.mem-head p { font-size: 13px; color: var(--muted); }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.count { background: var(--sunk); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; }
.count b { font-family: var(--mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--muted); }
.count i { font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--accent); min-height: 1.2em; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.mem-list { overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.empty-mem { border: 1px dashed var(--line); border-radius: 6px; padding: 18px; color: var(--muted); font-size: 14px; text-align: center; }
.ent { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ent.copy { border-style: dashed; }
.ent.new { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.ent-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ent-name { font-weight: 600; font-size: 14.5px; }
.ent-type { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.c-new { background: var(--accent-soft); color: var(--accent); }
.c-copy { background: var(--warn-bg); color: var(--warn); }
.c-notes { background: var(--ingest-bg); color: var(--ingest); }
.c-cons { background: var(--cons-bg); color: var(--cons); }
.c-elab { background: var(--elab-bg); color: var(--elab); }
.c-refl { background: var(--refl-bg); color: var(--refl); }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.facts li { background: var(--sunk); border-radius: 4px; padding: 6px 8px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.facts li.new { background: var(--accent-soft); }
.fk { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ent details { font-size: 12.5px; }
.ent summary { cursor: pointer; color: var(--muted); }
.ent summary b { color: var(--accent); font-weight: 500; }
.lk { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lk li { padding: 2px 0; border-bottom: 1px solid var(--line); }
.lk li.new { color: var(--fg); }
.lk li:not(.new) { color: var(--muted); }
.lk code { color: var(--elab); }
.nofacts { font-size: 12.5px; color: var(--muted); font-style: italic; }

/* Stage card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px clamp(16px, 3vw, 32px) 28px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.card h2 { font-size: clamp(24px, 3vw, 30px); font-weight: 700; line-height: 1.15; max-width: 26ch; }
.lead { color: var(--muted); max-width: 68ch; font-size: 16px; }
.card h3 { font-size: 16px; font-weight: 600; }
.block { display: flex; flex-direction: column; gap: 10px; }
.box { border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.box h4 { margin: 0; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.b-ingest { background: var(--ingest-bg); } .b-ingest h4 { color: var(--ingest); }
.b-cons { background: var(--cons-bg); } .b-cons h4 { color: var(--cons); }
.b-elab { background: var(--elab-bg); } .b-elab h4 { color: var(--elab); }
.b-refl { background: var(--refl-bg); } .b-refl h4 { color: var(--refl); }
.b-plain { background: var(--sunk); border: 1px dashed var(--line); } .b-plain h4 { color: var(--muted); }
.why { background: var(--why-bg); border: 1px solid var(--why-line); border-radius: 6px; padding: 12px 16px; font-size: 14.5px; }
.why b { color: var(--warn); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.jobline { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; }
.jobline span b { font-family: var(--mono); font-weight: 500; }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--sunk); }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td.num { font-family: var(--mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody th { font-weight: 600; }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.bars { min-width: 190px; }
.bar { display: grid; grid-template-columns: 44px 1fr 28px; align-items: center; gap: 8px; font-size: 12px; }
.bar + .bar { margin-top: 3px; }
.bar .t { height: 7px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar .f { display: block; height: 100%; border-radius: 4px; }
.bar .f.b { background: var(--muted); opacity: .45; }
.bar .f.a { background: var(--accent); }
.bar .n { font-family: var(--mono); text-align: right; }
.bar .lbl { color: var(--muted); }
.delta { font-family: var(--mono); color: var(--accent); font-weight: 600; white-space: nowrap; }

.finds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.finds li { display: grid; grid-template-columns: 4px 1fr; gap: 0 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.finds li::before { content: ""; border-radius: 2px; background: var(--cons); }
.finds li.watch::before { background: var(--warn); }
.finds b { display: block; }
.finds span { color: var(--muted); font-size: 14px; }

.notes { display: flex; flex-direction: column; gap: 10px; }
.note { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.note-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.note-h b { font-family: var(--display); font-weight: 600; }
.note-h .no { font-family: var(--mono); color: var(--accent); margin-right: 8px; font-weight: 500; }
.note p { font-size: 14px; color: var(--fg); max-width: 75ch; }
.note .body { display: flex; flex-direction: column; gap: 6px; }

.qa { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.qa h3 .qn { font-family: var(--mono); color: var(--refl); margin-right: 6px; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ans { font-size: 14.5px; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.side { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side.after { border-color: var(--refl); }
.side .ans { font-size: 14px; }
.qa details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.ev { margin: 6px 0 0; padding-left: 20px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.ev li.added { color: var(--fg); }
.wordings { display: flex; flex-wrap: wrap; gap: 6px; }
.wordings span { font-family: var(--mono); font-size: 12px; background: var(--elab-bg); color: var(--elab); padding: 2px 8px; border-radius: 3px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
.btn { border-radius: 999px; padding: 10px 20px; cursor: pointer; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.navinfo { font-family: var(--mono); font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .stagepane { order: 1; } .mempane { order: 2; }
  .mem { position: static; max-height: none; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
<style>
.tests { display: flex; gap: 6px; flex-wrap: wrap; }
.tests button { border: 1px solid var(--band-line); background: none; color: var(--band-muted); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13.5px; }
.tests button[aria-pressed="true"] { background: var(--band-fg); color: var(--band); border-color: var(--band-fg); font-weight: 600; }
.tests button:hover { color: var(--band-fg); }
.tests button[aria-pressed="true"]:hover { color: var(--band); }
.scopecard { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.scopecard h3 { font-size: 14.5px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.scopecard h3 code { font-weight: 400; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; text-align: right; }
.lyr { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.lyr-org { background: var(--accent-soft); color: var(--accent); }
.lyr-team { background: var(--ingest-bg); color: var(--ingest); }
.lyr-personal { background: var(--refl-bg); color: var(--refl); }
.lyr-all { background: var(--warn-bg); color: var(--warn); }
.facts li .tp { font-size: 11.5px; color: var(--muted); }
.facts li.win { box-shadow: inset 3px 0 0 var(--warn); }
.verdict td:first-child { white-space: nowrap; }
.verdict tr.all td { background: var(--warn-bg); }
.pill { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.p-no { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.p-yes { background: var(--cons-bg); color: var(--cons); }
.p-part { background: var(--warn-bg); color: var(--warn); }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.wrong { color: var(--warn); font-weight: 600; }
.missing { color: var(--muted); font-style: italic; }
@media (max-width: 900px) { .answers { grid-template-columns: 1fr; } }
</style>
<header class="band">

</div>

          ${[...LAYERS, 'all'].map((k) => `<tr class="${k === 'all' ? 'all' : ''}"><td>${lyr(k)}</td><td>${verdict(T, i, r, k)}</td><td class="num">${r[k].evidence.length}</td></tr>`).join('')}
        </tbody></table></div>
        <details><summary>Show the four answers in full</summary>${answerCards(r)}</details></div>`).join(''),
    },
    {
      short: 'Consolidate', mem: 2, prev: 1, memLabel: 'after Consolidate ran on each scope',
      title: `Consolidate reported ${consReported} facts and stored ${consStored}`,
      lead: 'We ran Consolidate on each scope separately, with a key limited to that scope. It only looks at facts inside the scope it runs on.',
      body: () => `
        <div class="tbl"><table><thead><tr><th>Scope</th><th>Time</th><th>Reported created</th><th>Stored</th></tr></thead><tbody>
          ${LAYERS.map((l) => `<tr><td>${lyr(l)}</td><td class="num">${D.cons[l].seconds} s</td><td class="num">${D.cons[l].summary.created}</td><td class="num">${newIn(D, 1, 2, l, 'facts').length}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="block"><h3>What it said it created</h3>
        <div class="tbl"><table><thead><tr><th>Scope</th><th>Reported fact</th><th>Proof</th></tr></thead><tbody>
          ${LAYERS.flatMap((l) => D.cons[l].items.map((it) => { const m = it.match(/^create \S (.+?) \(proof (\d+)\)/); return `<tr><td>${lyr(l)}</td><td>${esc(m ? m[1] : it)}</td><td class="num">${m ? m[2] : '–'}</td></tr>`; })).join('')}
        </tbody></table></div></div>
        <div class="box b-plain"><h4>What this tells us</h4><ul>
          <li>${consStored ? `Only the fact${consStored > 1 ? 's' : ''} with proof 2 or more ${consStored > 1 ? 'were' : 'was'} stored; every proof-1 fact was dropped.` : 'Every reported fact had proof 1, and none was stored.'}</li>
          <li>No run compared the conflicting values, because each run saw only one scope.</li></ul></div>`,
    },
    {
      short: 'Elaborate', mem: 3, prev: 2, memLabel: 'after Elaborate ran on each scope', openLinks: true,
      title: 'Elaborate added no link between the conflicting values',
      lead: `We ran Elaborate on each scope separately. It took ${LAYERS.map((l) => D.elabSeconds[l]).join(', ')} seconds.`,
      body: () => `
        <div class="tbl"><table><thead><tr><th>Scope</th><th>New links in this scope</th></tr></thead><tbody>
          ${LAYERS.map((l) => { const ls = newIn(D, 2, 3, l, 'links'); return `<tr><td>${lyr(l)}</td><td>${ls.length ? ls.map((k) => `<div class="${T.wrong && T.wrong.test(k.label) ? 'wrong' : ''}">${esc(k.s)} <code>${esc(k.label)}</code> ${esc(k.o)}</div>`).join('') : 'None'}</td></tr>`; }).join('')}
        </tbody></table></div>
        <div class="box b-plain"><h4>What this tells us</h4><ul>
          <li>${esc(T.elabNote)}</li>
          <li>Like Consolidate, Elaborate works within one scope, so it never sees the conflict.</li></ul></div>`,
    },
    {
      short: 'Reflect · after', mem: 3, memLabel: 'when the questions were asked again (unchanged)',
      title: 'After the jobs: the same answers',
      lead: `Same questions, same keys, saving still off. Evidence across all ${n * 4} answers went from ${evCount(D.before)} to ${evCount(D.after)} items.`,
      body: () => D.after.map((r, i) => {
        const b = D.before[i];
        return `<div class="qa"><h3><span class="qn">Q${i + 1}</span>${esc(r.q)}</h3>
        <div class="tbl"><table class="verdict"><thead><tr><th>Asked against</th><th>Answer after the jobs</th><th>Evidence</th></tr></thead><tbody>
          ${[...LAYERS, 'all'].map((k) => `<tr class="${k === 'all' ? 'all' : ''}"><td>${lyr(k)}</td><td>${verdict(T, i, r, k)}</td><td class="num">${b[k].evidence.length} → ${r[k].evidence.length}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="grid2">
          <div class="side"><p class="meta">All three · before</p><div class="ans">${md(b.all.answer)}</div></div>
          <div class="side after"><p class="meta">All three · after</p><div class="ans">${md(r.all.answer)}</div></div>
        </div></div>`;
      }).join(''),
    },
    {
      short: 'Reflect · saving on', mem: 4, prev: 3, memLabel: 'after Reflect ran with saving on',
      title: 'Reflect with saving on stored nothing',
      lead: `Saving is the one path that can write new facts from Reflect. We asked question ${n} once with saving on, reading all three scopes and writing to personal.`,
      body: () => `
        <div class="qa"><h3><span class="qn">Q${n}</span>${esc(D.persist.q)}</h3>
        <p class="meta">All three · ${D.persist.evidence} evidence · ${D.persist.seconds} s · saved ${D.persist.saved.length}</p>
        <div class="ans">${md(D.persist.answer)}</div></div>
        <div class="box b-plain"><h4>What this tells us</h4><ul>
          <li>The answer named the conflict again and left the choice open.</li>
          <li>Agent Memory saved no fact, and the personal scope is unchanged.</li></ul></div>`,
    },
    {
      short: 'How we ran it', mem: 4, memLabel: 'at the end',
      title: 'How we ran it',
      lead: 'A fresh test tree, one note per scope, and the same questions before and after the two jobs.',
      body: () => `
        <ol class="steps">
          <li>Created <code>${esc(D.root)}</code>, with team/ops and user/vidyul below it.</li>
          <li>Captured one note per scope, with full extraction, and took a snapshot of each scope.</li>
          <li>Asked ${n} questions with Reflect against each scope and against all three, with saving off.</li>
          <li>Ran Consolidate, then Elaborate, on each scope, with a snapshot after each.</li>
          <li>Asked the same questions again, then asked question ${n} once with saving on.</li>
        </ol>
        <div class="box b-plain"><h4>Limits</h4><ul>${T.limits.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`,
    },
  ];
}
TESTS.forEach((T) => { T.stages = makeStages(T); });

/* ---------- memory pane ---------- */
function renderMemory(T, stage) {
  const D = T.D, st = stage.mem;
  if (!st) {
    $('mem-sub').innerHTML = `The three test scopes under <code>${esc(D.root)}</code> are empty at this stage.`;
    $('counts').innerHTML = [['3', 'Scopes'], ['0', 'Facts'], ['0', 'Links']].map(([v, l]) => `<div class="count"><b>${v}</b><span>${l}</span><i></i></div>`).join('');
    $('mem-list').innerHTML = '<div class="empty-mem">Nothing stored yet.<br>The three notes go in at stage 3.</div>';
    return;
  }
  const hasPrev = stage.prev !== undefined;
  const delta = (what) => { if (!hasPrev) return ''; const d = total(D, st, what) - (stage.prev ? total(D, stage.prev, what) : 0); return d > 0 ? `+${d} this stage` : 'no change'; };
  $('mem-sub').innerHTML = `What the three test scopes hold ${esc(stage.memLabel)}. Conflicting terms have a marker on the left.`;
  $('counts').innerHTML = [['3', 'Scopes', ''], [total(D, st, 'facts'), 'Facts', delta('facts')], [total(D, st, 'links'), 'Links', delta('links')]]
    .map(([v, l, d]) => `<div class="count"><b>${v}</b><span>${l}</span><i>${d}</i></div>`).join('');
  const chip = (src) => src === 'elaboration' ? '<span class="chip c-elab">Elaborate · trust 0.3</span>'
    : src === 'consolidation' ? '<span class="chip c-cons">Consolidate</span>' : src === 'reflect' ? '<span class="chip c-refl">Reflect</span>' : '<span class="chip c-notes">From the note</span>';
  $('mem-list').innerHTML = LAYERS.map((l) => {
    const s = D.mem[st][l];
    const pf = new Set(hasPrev && stage.prev ? D.mem[stage.prev][l].facts.map((x) => x.id) : []);
    const pl = new Set(hasPrev && stage.prev ? D.mem[stage.prev][l].links.map((x) => x.id) : []);
    const isNew = (x, set) => hasPrev && !set.has(x.id);
    return `<section class="scopecard"><h3><span>${lyr(l)}</span><code>${esc(s.scope)}</code></h3>
      <ul class="facts">${s.facts.map((f) => `<li class="${isNew(f, pf) ? 'new' : ''}${T.conflict.test(f.key) ? ' win' : ''}"><span>${esc(f.value)}</span>
        <span class="fk"><span class="tp">${esc(f.topic)} · ${esc(f.key.replace(/_/g, ' '))}</span> ${chip(f.source)}</span></li>`).join('')}</ul>
      <details${stage.openLinks ? ' open' : ''}><summary>${s.links.length} links</summary><ul class="lk">${s.links.map((k) =>
        `<li class="${isNew(k, pl) ? 'new' : ''}">${esc(k.s)} → <code>${esc(k.label)}</code> ${esc(k.o)} ${k.source === 'elaboration' ? '<span class="chip c-elab">Elaborate</span>' : ''}</li>`).join('')}</ul></details>
    </section>`;
  }).join('');
}

/* ---------- navigation ---------- */
let ti = 0, cur = 0;
function show(t, i, push) {
  ti = Math.max(0, Math.min(TESTS.length - 1, t));
  const T = TESTS[ti], S = T.stages;
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $('tests').innerHTML = TESTS.map((x, j) => `<button type="button" data-t="${j}" aria-pressed="${j === ti}">${esc(x.name)}</button>`).join('');
  $('rail').innerHTML = S.map((x, j) =>
    `<button type="button" data-i="${j}" class="${j === cur ? 'on' : j < cur ? 'done' : ''}" aria-current="${j === cur ? 'step' : 'false'}"><span class="n">${String(j + 1).padStart(2, '0')}</span><span class="l">${esc(x.short)}</span></button>`).join('');
  $('card').innerHTML = `<p class="eyebrow">${esc(T.name)} · Stage ${cur + 1} of ${S.length}</p><h2>${esc(s.title)}</h2><p class="lead">${s.lead}</p>${s.body()}`;
  renderMemory(T, s);
  $('scope').textContent = T.D.root;
  $('back').disabled = cur === 0;
  $('next').disabled = cur === S.length - 1;
  $('navinfo').textContent = `${cur + 1} / ${S.length}`;
  const on = $('rail').querySelector('.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  if (push) { history.replaceState(null, '', `#${T.id}-stage-${cur + 1}`); window.scrollTo({ top: 0 }); }
}
$('tests').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.t, 0, true); });
$('rail').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(ti, +b.dataset.i, true); });
$('back').addEventListener('click', () => show(ti, cur - 1, true));
$('next').addEventListener('click', () => show(ti, cur + 1, true));
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea, summary')) return;
  if (e.key === 'ArrowRight') show(ti, cur + 1, true);
  if (e.key === 'ArrowLeft') show(ti, cur - 1, true);
});
const fromHash = () => { const m = location.hash.match(/^#t(\d)-stage-(\d+)$/); return m ? [+m[1] - 1, +m[2] - 1] : [0, 0]; };
window.addEventListener('hashchange', () => show(...fromHash(), false));
show(...fromHash(), false);
</script>
