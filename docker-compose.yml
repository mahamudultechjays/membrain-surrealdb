# Local development stack: FastAPI (hot reload) + Vite (HMR).
# Agent Memory is hosted on SurrealDB Cloud; the backend reaches it over HTTPS
# using the AGENT_MEMORY_* settings in .env, so there is no database service here.
# Production-shaped images: `make prod` layers docker-compose.prod.yml on top.
name: membrain-surrealdb-poc

services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      # Docker Desktop on macOS/Windows delivers no filesystem events through a
      # bind mount, so uvicorn --reload needs polling to see host edits.
      WATCHFILES_FORCE_POLLING: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Whole backend/ for hot reload; the venv lives at /opt/venv, untouched.
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "1"
    ports:
      # 5174 by default so this runs alongside membrain, which owns 5173.
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules (Linux binaries) rather than the host's.
      # `make up` passes --renew-anon-volumes so a dependency change is picked up.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
